name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'a1care backend/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'nginx/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            # Navigate to the project directory
            cd ~/api-main
            
            # Pull the latest changes from GitHub
            git pull origin main
            
            # --- RUN DIAGNOSTICS ---
            echo "=== CURRENT DIRECTORY & BRANCH ==="
            pwd
            git status
            
            echo "=== DOCKER STATUS ==="
            docker ps -a
            
            echo "=== PM2 STATUS ==="
            pm2 status || echo "PM2 not found or not running"
            
            echo "=== ACTIVE PORTS (3000 / 80 / 443) ==="
            ss -tuln | grep -E "3000|80|443" || echo "No ports active or ss not available"
            
            echo "=== HOST NGINX CONFIGS ==="
            cat /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null || echo "No local Nginx configs found"

            # --- ENSURE SWAP EXISTS ---
            echo "Checking swap space..."
            if ! sudo swapon --show | grep -q 'swapfile'; then
              echo "Setting up 2GB swap file..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            
            # --- RAM SAVING OPS BEFORE BUILD ---
            echo "Stopping container to free RAM for build..."
            docker stop a1care-api || true
            docker stop a1care-nginx || true
            docker rm a1care-nginx || true

            # Build and restart containers using Docker Compose
            docker compose up -d --build
            
            # --- RAM & DISK SAVING OPS ---
            # Remove stopped containers, unused networks, and dangling images
            docker system prune -f
            
            # Specifically remove all unused images (not just dangling ones) to save more space
            # This is safe because 'docker compose up' just created/started the needed ones
            docker image prune -a -f
            
            # Optional: Clear build cache to save disk space
            docker builder prune -f
            
            echo "Deployment complete and cleanup finished."
            echo "=== API LOGS ==="
            docker logs --tail 100 a1care-api
            echo "=== NGINX LOGS ==="
            docker logs --tail 100 a1care-nginx

